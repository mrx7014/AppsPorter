name: Porting OEM Apps
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "APK download link (ex: APKMirror app page)"
        required: true
        type: string

      apk_name:
        description: "Output APK name (ex: OplusCalculator)"
        required: true
        type: string

      patch:
        description: "Patch Type (ex: samsung,oneplus,moto,xiaomi,oppo)"
        required: true
        type: string

      run_id:
        description: "Release ID (ex: oppocalculator-cos17)"
        required: true
        type: string

      ai:
        description: "Extra: AI smali review of injected classes (true/false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Start Cloudflare WARP (SOCKS5 on 127.0.0.1:40000)
        if: contains(inputs.apk_link, 'apkmirror.com')
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if warp-cli --accept-tos status | grep -q 'Status update: Connected'; then
              break
            fi
            sleep 2
          done
          warp-cli --accept-tos status
          curl -fsS --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)='

      - name: Install curl-impersonate
        if: contains(inputs.apk_link, 'apkmirror.com')
        run: |
          set -euo pipefail
          VER=v0.6.1
          curl -fL --retry 3 \
            "https://github.com/lwthiker/curl-impersonate/releases/download/${VER}/curl-impersonate-${VER}.x86_64-linux-gnu.tar.gz" \
            -o ci.tgz
          sudo tar -xzf ci.tgz -C /usr/local/bin
          rm -f ci.tgz
          command -v curl_chrome116
          curl_chrome116 --version | head -1

      - name: Diagnose Cloudflare response
        if: contains(inputs.apk_link, 'apkmirror.com')
        continue-on-error: true
        env:
          APK_LINK: ${{ inputs.apk_link }}
        run: |
          probe() {
            local name="$1" url="$2"
            shift 2
            local code
            code="$("$@" -s -o /tmp/p.html -D /tmp/p.hdr -w '%{http_code}' --max-time 30 "$url" || true)"
            echo "== $name -> HTTP $code"
            grep -iE '^(cf-mitigated|server|cf-ray):' /tmp/p.hdr || true
            grep -oiP '<title>\K[^<]+' /tmp/p.html | head -1 || true
          }
          WARP=socks5h://127.0.0.1:40000
          probe "chrome116 + WARP, page" "$APK_LINK" curl_chrome116 --proxy "$WARP"
          probe "chrome116 + WARP, homepage" "https://www.apkmirror.com/" curl_chrome116 --proxy "$WARP"
          probe "chrome116 direct, page" "$APK_LINK" curl_chrome116
          probe "plain curl + WARP, page" "$APK_LINK" curl --proxy "$WARP"

      - name: Download source APK
        env:
          APK_LINK: ${{ inputs.apk_link }}
          CURL_BIN: curl_chrome116
          # Defaults to the local WARP proxy; the optional APK_PROXY secret overrides it
          ALL_PROXY: ${{ secrets.APK_PROXY || 'socks5h://127.0.0.1:40000' }}
        run: |
          set -euo pipefail

          APK_PATH="$GITHUB_WORKSPACE/input.apk"

          if [[ "$APK_LINK" == *"apkmirror.com"* ]]; then
            echo "Downloading APK using APKMirror downloader..."

            if [ ! -f "scripts/apkmirror-dl.sh" ]; then
              echo "::error::scripts/apkmirror-dl.sh not found."
              exit 1
            fi

            chmod +x scripts/apkmirror-dl.sh

            [ -n "${ALL_PROXY:-}" ] || unset ALL_PROXY

            if ! bash scripts/apkmirror-dl.sh -o "$APK_PATH" "$APK_LINK"; then
              echo "::error::APKMirror blocked this runner (Cloudflare 403)."
              echo "::error::Fix: download the APK manually, upload it (GitHub Release / GoFile), and pass the direct link in apk_link."
              exit 1
            fi
          else
            echo "Downloading APK using curl..."
            curl -fL --retry 3 --retry-delay 2 "$APK_LINK" -o "$APK_PATH"
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK download failed or the file is empty."
            exit 1
          fi

          echo "APK downloaded successfully."
          ls -lh "$APK_PATH"

      - name: Run port
        env:
          PATCH_NAME: ${{ inputs.patch }}
          AI_INPUT: ${{ inputs.ai }}
          # optional: set a repo variable AI_API_URL to use another endpoint
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          set -euo pipefail

          PORT_ARGS=()
          if [ "$AI_INPUT" = "true" ]; then
            echo "AI smali review: ON"
            PORT_ARGS+=(--ai)
          else
            echo "AI smali review: OFF"
          fi

          bash build_port.sh input.apk "$PATCH_NAME" "${PORT_ARGS[@]}"

      - name: Verify and Rename APK
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail

          echo "Searching for generated APK files..."
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          APK_PATH="$GITHUB_WORKSPACE/out/input_ported.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Ported APK not found or empty: $APK_PATH"
            exit 1
          fi

          APK_NAME="${APK_NAME%.apk}"
          APK_NAME="$(echo "$APK_NAME" | xargs)"

          if [[ ! "$APK_NAME" =~ ^[a-zA-Z0-9._-]+$ ]] || \
             [ "$APK_NAME" = "." ] || \
             [ "$APK_NAME" = ".." ] || \
             [ -z "$APK_NAME" ]; then
            echo "::error::Invalid APK name."
            echo "Use only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi

          NEW_APK_PATH="$GITHUB_WORKSPACE/out/${APK_NAME}.apk"

          if [ "$APK_PATH" != "$NEW_APK_PATH" ]; then
            mv "$APK_PATH" "$NEW_APK_PATH"
          fi

          echo "APK verified and renamed successfully."
          echo "Output: $NEW_APK_PATH"
          echo "Size: $(du -h "$NEW_APK_PATH" | cut -f1)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.run_id }}
          PATCH_NAME: ${{ inputs.patch }}
          APK_NAME: ${{ inputs.apk_name }}
          AI_STATE: ${{ inputs.ai && 'on' || 'off' }}
        run: |
          set -euo pipefail

          RELEASE_NAME="$(echo "$RELEASE_NAME" | xargs)"

          APK_NAME="${APK_NAME%.apk}"
          APK_NAME="$(echo "$APK_NAME" | xargs)"
          APK_PATH="$GITHUB_WORKSPACE/out/${APK_NAME}.apk"

          TAG="port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Renamed APK not found or empty: $APK_PATH"
            exit 1
          fi

          APK_SIZE="$(du -h "$APK_PATH" | cut -f1)"

          ASSETS=("$APK_PATH")
          if [ -s "$GITHUB_WORKSPACE/out/classfix_report.json" ]; then
            ASSETS+=("$GITHUB_WORKSPACE/out/classfix_report.json")
          fi
          if [ -s "$GITHUB_WORKSPACE/out/ai_report.json" ]; then
            ASSETS+=("$GITHUB_WORKSPACE/out/ai_report.json")
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "## 🚀 OEM App Port

          Successfully generated a ported APK using GitHub Actions.

          ### 📦 Build Information

          | Property | Value |
          |----------|-------|
          | Release ID | \`${RELEASE_NAME}\` |
          | Patch Type | \`${PATCH_NAME}\` |
          | AI Review | \`${AI_STATE}\` |
          | APK File | \`${APK_NAME}.apk\` |
          | APK Size | \`${APK_SIZE}\` |
          | Build Date | \`${BUILD_DATE}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Run Attempt | \`${GITHUB_RUN_ATTEMPT}\` |
          | Repository | [\`${GITHUB_REPOSITORY}\`](https://github.com/${GITHUB_REPOSITORY}) |
          | Workflow | [View Build Logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

          ### 📥 Installation

          1. Download \`${APK_NAME}.apk\` from the Assets section below and install it.
          ---
          *Generated automatically by GitHub Actions.*" \
            --latest=false

          echo "Release created successfully."
          echo "Release ID: $RELEASE_NAME"
          echo "Patch: $PATCH_NAME"
          echo "APK: ${APK_NAME}.apk"
          echo "Tag: $TAG"
          echo "APK Size: $APK_SIZE"
